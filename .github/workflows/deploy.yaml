
name: Laravel 13 CI/CD Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, mysql, zip, bcmath, intl, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Code Style Check
        run: ./vendor/bin/pint --test

      - name: Execute Tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""

  deploy:
    name: Deploy to CloudPanel
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            cd /home/mav-php/htdocs/php.mav.my.id

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Installing production dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend assets..."
            npm run build

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Clearing old Laravel caches..."
            php artisan optimize:clear

            echo "Caching Laravel configuration..."
            php artisan config:cache

            echo "Caching Laravel routes..."
            php artisan route:cache

            echo "Caching Laravel views..."
            php artisan view:cache

            echo "Deployment completed successfully!"
