name: Laravel 13 CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4] # Kept to current stable active versions

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, zip, pdo_mysql, bcmath, intl, curl
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Setup Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Compile Front-End Assets
      run: |
        npm install
        npm run build

    - name: Run Code Style Check (Pint)
      run: ./vendor/bin/pint --test

    - name: Execute Tests via PHPUnit / Pest
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: php artisan test

  deploy:
    # 1. ONLY runs if tests pass
    # 2. ONLY runs on the main branch push events
    needs: laravel-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- CHOOSE ONE OF THE DEPLOYMENT STRATEGIES BELOW ---

    # STRATEGY A: Deployment via SSH (Best for standard VPS / DigitalOcean / Linode)
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /var/www/my-laravel-app
          git pull origin main
          composer install --no-dev --optimize-autoloader --no-interaction
          npm install && npm run build
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart

    # STRATEGY B: Deployment via Webhook (Best for Laravel Forge / Ploi / Envoyer)
    # (Uncomment below and remove Strategy A if using a platform webhook)
    # - name: Deploy via Forge Webhook
    #   run: curl -s "${{ secrets.DEPLOYMENT_WEBHOOK_URL }}"
